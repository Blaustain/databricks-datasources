version: 2

models:

  - name: dim_cliente
    description: Dimensão que representa os clientes utilizados nas vendas.

    columns:

      - name: customer_sk
        description: Chave substituta da dimensão.

      - name: customer_id
        description: Identificador original do cliente.

      - name: customer_name
        description: Nome completo do cliente.

      - name: customer_type
        description: Classificação entre Pessoa Física e Loja.

      - name: territory_id
        description: Território comercial do cliente.

      - name: store_id
        description: Loja associada ao cliente quando existente.

  - name: dim_produto
    description: Dimensão contendo os atributos descritivos dos produtos.

    columns:

      - name: product_sk
        description: Chave substituta do produto.

      - name: product_name
        description: Nome do produto.

      - name: product_category_name
        description: Categoria do produto.

      - name: product_subcategory_name
        description: Subcategoria do produto.

      - name: standard_cost
        description: Custo padrão.

      - name: list_price
        description: Preço de tabela.

  - name: dim_data
    description: Dimensão calendário utilizada nas análises temporais.

    columns:

      - name: date_sk
        description: Chave da data.

      - name: full_date
        description: Data completa.

      - name: year
        description: Ano.

      - name: semester
        description: Semestre.

      - name: quarter
        description: Trimestre.

      - name: month
        description: Mês.

      - name: month_name
        description: Nome do mês.

      - name: week_of_year
        description: Semana do ano.

      - name: day_name
        description: Nome do dia da semana.

      - name: is_weekend
        description: Indicador de final de semana.

  - name: dim_localizacao
    description: Dimensão geográfica utilizada para análise regional.

    columns:

      - name: location_sk
        description: Chave substituta da localização.

      - name: city
        description: Cidade.

      - name: state_name
        description: Estado ou província.

      - name: country_name
        description: País.

      - name: postal_code
        description: CEP.

  - name: dim_cartao
    description: Dimensão contendo informações dos cartões utilizados nas vendas.

    columns:

      - name: credit_card_sk
        description: Chave substituta do cartão.

      - name: card_type
        description: Tipo do cartão.

      - name: expiration_month
        description: Mês de expiração.

      - name: expiration_year
        description: Ano de expiração.

  - name: dim_motivo_venda
    description: Dimensão contendo os motivos associados às vendas.

    columns:

      - name: sales_reason_sk
        description: Chave substituta do motivo.

      - name: sales_reason
        description: Nome do motivo da venda.

      - name: reason_type
        description: Categoria do motivo.