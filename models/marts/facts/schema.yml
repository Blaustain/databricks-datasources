version: 2

models:

  - name: fct_vendas

    description: |
      Tabela fato contendo os itens vendidos no Adventure Works.
      Cada registro representa um item de um pedido de venda.

    columns:

      - name: sales_order_detail_id
        description: Identificador único do item vendido.

      - name: sales_order_id
        description: Identificador do pedido.

      - name: customer_sk
        description: FK para dim_cliente.

      - name: product_sk
        description: FK para dim_produto.

      - name: date_sk
        description: FK para dim_data.

      - name: credit_card_sk
        description: FK para dim_cartao.

      - name: location_sk
        description: FK para dim_localizacao.

      - name: order_quantity
        description: Quantidade vendida.

      - name: unit_price
        description: Preço unitário.

      - name: unit_price_discount
        description: Desconto aplicado.

      - name: line_total
        description: Valor total do item.

      - name: subtotal
        description: Subtotal do pedido.

      - name: tax_amount
        description: Valor de impostos.

      - name: freight
        description: Valor do frete.

      - name: total_due
        description: Valor total da venda.

      - name: sales_reason
        description: Motivos associados ao pedido.