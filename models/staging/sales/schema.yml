version: 2

models:

  - name: stg_salesorderheader
    description: Cabeçalho dos pedidos de venda.

    columns:

      - name: sales_order_id
        tests:
          - unique
          - not_null

      - name: customer_id
        tests:
          - not_null

      - name: order_date
        tests:
          - not_null

      - name: total_due
        tests:
          - not_null

  - name: stg_salesorderdetail
    description: Itens dos pedidos.

    columns:

      - name: sales_order_detail_id
        tests:
          - unique
          - not_null

      - name: sales_order_id
        tests:
          - not_null

      - name: product_id
        tests:
          - not_null

  - name: stg_customer

    columns:

      - name: customer_id
        tests:
          - unique
          - not_null

  - name: stg_creditcard

    columns:

      - name: credit_card_id
        tests:
          - unique
          - not_null

  - name: stg_salesreason

    columns:

      - name: sales_reason_id
        tests:
          - unique
          - not_null

  - name: stg_salesorderheadersalesreason

    columns:

      - name: sales_order_id
        tests:
          - not_null

      - name: sales_reason_id
        tests:
          - not_null